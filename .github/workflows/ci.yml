name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold platform folders
        run: |
          flutter create . --org com.lemancybersecurity \
            --project-name leman_mail --platforms android

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      # Non bloquant pour l'instant : le code initial a été écrit sans
      # formateur ; repasser en --set-exit-if-changed après un
      # `dart format lib test` local commité.
      - name: Check formatting (informational)
        run: dart format --output=none --set-exit-if-changed lib test || true

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
